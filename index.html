<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">

<title>台股 AI 研究站</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans TC",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:#111827;
  color:white;
  padding:16px 18px;
}

header b{
  font-size:19px;
}

header span{
  display:block;
  margin-top:4px;
  font-size:12px;
  color:#cbd5e1;
}

main{
  max-width:960px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

h2{
  font-size:18px;
  margin:0 0 12px;
}

.search{
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  min-width:0;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:12px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:#2563eb;
  color:white;
  font-size:15px;
  font-weight:600;
}

button:active{
  transform:scale(.98);
}

.status{
  margin-top:10px;
  font-size:13px;
  color:#64748b;
}

.result{
  margin-top:14px;
}

.stock-name{
  font-size:22px;
  font-weight:700;
}

.stock-code{
  color:#64748b;
  font-size:14px;
}

.price{
  font-size:30px;
  font-weight:800;
  margin:10px 0;
}

.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.item{
  background:#f8fafc;
  border-radius:10px;
  padding:10px;
}

.item small{
  display:block;
  color:#64748b;
  margin-bottom:4px;
}

.inst-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #eef2f7;
  font-size:14px;
}

.inst-row:last-child{
  border-bottom:0;
}

.positive{
  color:#dc2626;
  font-weight:700;
}

.negative{
  color:#16a34a;
  font-weight:700;
}

.error{
  background:#fef2f2;
  color:#b91c1c;
  padding:10px;
  border-radius:10px;
}

.hint{
  color:#64748b;
  line-height:1.6;
  font-size:14px;
}

footer{
  text-align:center;
  color:#64748b;
  font-size:12px;
  padding:10px 0 25px;
}

@media(max-width:500px){
  .metrics{
    grid-template-columns:1fr 1fr;
  }

  .search{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <b>📈 台股 AI 研究站</b>
  <span>TWSE 自動資料更新・研究與教學用途</span>
</header>

<main>

<section class="card">
  <h2>🔎 股票搜尋</h2>

  <div class="search">
    <input
      id="q"
      type="text"
      inputmode="text"
      placeholder="輸入股票代號，例如 2330"
    >
    <button onclick="searchStock()">搜尋</button>
  </div>

  <div id="stockStatus" class="status">
    股票資料載入中…
  </div>

  <div id="stockResult" class="result"></div>
</section>

<section class="card">
  <h2>🏦 三大法人資料</h2>

  <div id="instStatus" class="status">
    法人資料載入中…
  </div>

  <div id="instResult"></div>
</section>

<section class="card">
  <h2>🤖 研究功能</h2>

  <div class="hint">
    目前網站已接上 GitHub Actions 自動取得的台股資料。
    後續可以繼續加入量價突破、法人籌碼、技術指標、
    選股掃描與 AI 分析功能。
  </div>
</section>

<footer>
  ⚠️ 本站為研究與教學用途，資料不構成投資建議。
</footer>

</main>

<script>
let stocksData = [];
let institutionalData = null;

function number(v){
  const n = Number(String(v ?? "").replace(/,/g,""));
  return Number.isFinite(n) ? n : null;
}

function formatNumber(v){
  const n = number(v);
  if(n === null) return "-";
  return n.toLocaleString("zh-TW");
}

function getStockCode(row){
  return String(
    row.Code ??
    row.code ??
    row["證券代號"] ??
    row["股票代號"] ??
    ""
  ).trim();
}

function getStockName(row){
  return String(
    row.Name ??
    row.name ??
    row["證券名稱"] ??
    row["股票名稱"] ??
    ""
  ).trim();
}

function getValue(row,names){
  for(const name of names){
    if(row[name] !== undefined && row[name] !== null){
      return row[name];
    }
  }
  return "-";
}

async function loadStocks(){
  const status = document.getElementById("stockStatus");

  try{
    const response = await fetch(
      "./data/stocks.json?v=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const json = await response.json();

    stocksData =
      Array.isArray(json) ? json :
      Array.isArray(json.stocks) ? json.stocks :
      Array.isArray(json.data) ? json.data :
      [];

    status.textContent =
      `✅ 股票資料已載入：${stocksData.length.toLocaleString()} 筆`;

  }catch(error){
    console.error(error);

    status.innerHTML =
      `<div class="error">
      ❌ stocks.json 載入失敗：${error.message}
      </div>`;
  }
}

async function loadInstitutional(){
  const status = document.getElementById("instStatus");

  try{
    const response = await fetch(
      "./data/institutional.json?v=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    institutionalData = await response.json();

    const count =
      institutionalData.count ??
      institutionalData.institutional?.length ??
      institutionalData.data?.length ??
      0;

    const updated =
      institutionalData.updated_at ?? "時間未提供";

    status.textContent =
      `✅ 法人資料已載入：${Number(count).toLocaleString()} 筆`;

    document.getElementById("instResult").innerHTML =
      `<div class="inst-row">
        <span>資料來源</span>
        <b>${institutionalData.source ?? "TWSE"}</b>
      </div>

      <div class="inst-row">
        <span>更新時間</span>
        <b>${updated}</b>
      </div>`;

  }catch(error){
    console.error(error);

    status.innerHTML =
      `<div class="error">
      ❌ institutional.json 載入失敗：${error.message}
      </div>`;
  }
}

function searchStock(){
  const input = document.getElementById("q");
  const output = document.getElementById("stockResult");

  const query = input.value.trim();

  if(!query){
    output.innerHTML =
      `<div class="error">
      請輸入股票代號，例如 2330
      </div>`;
    return;
  }

  if(!stocksData.length){
    output.innerHTML =
      `<div class="error">
      股票資料還沒載入完成，等一下再試一次。
      </div>`;
    return;
  }

  const stock = stocksData.find(row =>
    getStockCode(row) === query ||
    getStockName(row).includes(query)
  );

  if(!stock){
    output.innerHTML =
      `<div class="error">
      找不到「${query}」的股票資料。
      </div>`;
    return;
  }

  const code = getStockCode(stock);
  const name = getStockName(stock);

  const close = getValue(stock,[
    "ClosingPrice",
    "close",
    "收盤價"
  ]);

  const open = getValue(stock,[
    "OpeningPrice",
    "open",
    "開盤價"
  ]);

  const high = getValue(stock,[
    "HighestPrice",
    "high",
    "最高價"
  ]);

  const low = getValue(stock,[
    "LowestPrice",
    "low",
    "最低價"
  ]);

  const volume = getValue(stock,[
    "TradeVolume",
    "volume",
    "成交股數"
  ]);

  output.innerHTML = `
    <div class="stock-name">
      ${name || "股票"}
    </div>

    <div class="stock-code">
      ${code}
    </div>

    <div class="price">
      ${formatNumber(close)}
    </div>

    <div class="metrics">
      <div class="item">
        <small>開盤</small>
        <b>${formatNumber(open)}</b>
      </div>

      <div class="item">
        <small>最高</small>
        <b>${formatNumber(high)}</b>
      </div>

      <div class="item">
        <small>最低</small>
        <b>${formatNumber(low)}</b>
      </div>

      <div class="item">
        <small>成交股數</small>
        <b>${formatNumber(volume)}</b>
      </div>
    </div>
  `;
}

document.getElementById("q")
.addEventListener("keydown",function(event){
  if(event.key === "Enter"){
    searchStock();
  }
});

Promise.all([
  loadStocks(),
  loadInstitutional()
]);

</script>

</body>
</html>
