name: Update Active ETF Holdings

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一～週五 22:30
    - cron: "30 14 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Cathay 00400A holdings
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone, timedelta

          OUTPUT_FILE = "data/active_etf_holdings.json"
          HISTORY_DIR = "data/active_etf_holdings_history"

          os.makedirs("data", exist_ok=True)
          os.makedirs(HISTORY_DIR, exist_ok=True)

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)

          API = (
              "https://cwapi.cathaysite.com.tw"
              "/api/ETF/GetETFDetailStockList"
          )

          ETF_CODE = "00400A"
          ETF_NAME = "主動國泰動能高息"
          FUND_CODE = "EA"

          headers = {
              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/120 Safari/537.36",

              "Accept":
                  "application/json, text/plain, */*",

              "Accept-Language":
                  "zh-TW,zh;q=0.9,en;q=0.8",

              "Origin":
                  "https://www.cathaysite.com.tw",

              "Referer":
                  "https://www.cathaysite.com.tw/"
          }

          def fetch(date_text):

              params = urllib.parse.urlencode({
                  "FundCode": FUND_CODE,
                  "SearchDate": date_text
              })

              url = API + "?" + params

              print("Requesting:", date_text)

              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except Exception as error:
                  print("Request error:", error)
                  return None

          # -----------------------------------------
          # 往前找最近有資料的交易日
          # 最多找 10 天
          # -----------------------------------------

          result = None
          holdings_date = None

          for days_back in range(0, 10):

              target = (
                  now - timedelta(days=days_back)
              ).strftime("%Y-%m-%d")

              data = fetch(target)

              if not data:
                  continue

              if not data.get("success"):
                  print(
                      "API returned non-success:",
                      data.get("returnMessage")
                  )
                  continue

              rows = data.get("result")

              if rows:
                  result = rows
                  holdings_date = target
                  break

          if not result:
              raise RuntimeError(
                  "00400A 最近 10 天找不到官方持股資料"
              )

          # -----------------------------------------
          # 整理國泰官方資料
          # -----------------------------------------

          holdings = []

          for row in result:

              code = str(
                  row.get("stockCode") or ""
              ).strip()

              name = str(
                  row.get("stockName") or ""
              ).strip()

              if not code:
                  continue

              try:
                  shares = int(
                      float(
                          str(
                              row.get("volumn") or "0"
                          ).replace(",", "")
                      )
                  )
              except Exception:
                  shares = 0

              try:
                  weight = float(
                      str(
                          row.get("weights") or "0"
                      )
                      .replace("%", "")
                      .replace(",", "")
                  )
              except Exception:
                  weight = 0

              holdings.append({
                  "code": code,
                  "name": name,
                  "shares": shares,
                  "weight": weight
              })

          if not holdings:
              raise RuntimeError(
                  "API 有回應，但沒有解析到任何持股"
              )

          holdings.sort(
              key=lambda item: item["weight"],
              reverse=True
          )

          # -----------------------------------------
          # 讀取舊資料
          # -----------------------------------------

          if os.path.exists(OUTPUT_FILE):

              try:
                  with open(
                      OUTPUT_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      output = json.load(f)

              except Exception:
                  output = {}

          else:
              output = {}

          if not isinstance(output, dict):
              output = {}

          if "etfs" not in output:
              output["etfs"] = {}

          # -----------------------------------------
          # 寫入 00400A 真實持股
          # -----------------------------------------

          output["etfs"][ETF_CODE] = {
              "code": ETF_CODE,
              "name": ETF_NAME,
              "issuer": "國泰投信",
              "holdings_date": holdings_date,
              "source":
                  "Cathay Securities Investment Trust",
              "status": "success",
              "holding_count": len(holdings),
              "holdings": holdings
          }

          output["_meta"] = {
              "updated_at": now.isoformat(),
              "database_version": 2,
              "description":
                  "Taiwan active ETF daily holdings database",
              "history_enabled": True
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # -----------------------------------------
          # 以「真正持股日期」保存快照
          # 不使用 workflow 執行日期冒充資料日期
          # -----------------------------------------

          history_file = os.path.join(
              HISTORY_DIR,
              holdings_date + ".json"
          )

          with open(
              history_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # -----------------------------------------
          # 顯示結果，方便 Actions 檢查
          # -----------------------------------------

          print()
          print("================================")
          print("00400A HOLDINGS SUCCESS")
          print("================================")
          print("ETF:", ETF_CODE, ETF_NAME)
          print("Holdings date:", holdings_date)
          print("Holding count:", len(holdings))
          print()

          print("Top 10 holdings:")

          for item in holdings[:10]:

              print(
                  item["code"],
                  item["name"],
                  "shares:",
                  item["shares"],
                  "weight:",
                  item["weight"],
                  "%"
              )

          print()
          print("Saved:", OUTPUT_FILE)
          print("Snapshot:", history_file)

          PY

      - name: Commit active ETF holdings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/active_etf_holdings.json
          git add data/active_etf_holdings_history/

          if git diff --cached --quiet; then
            echo "No ETF holding changes"
          else
            git commit -m "Update 00400A official holdings"
            git push
          fi
