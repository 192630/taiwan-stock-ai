name: Update Active ETF Holdings

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一～週五 22:30
    - cron: "30 14 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          pip install requests

      - name: Fetch active ETF holdings
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          import urllib.parse
          import urllib.request
          import urllib3

          from datetime import datetime, timezone, timedelta

          urllib3.disable_warnings(
              urllib3.exceptions.InsecureRequestWarning
          )

          OUTPUT_FILE = "data/active_etf_holdings.json"
          HISTORY_DIR = "data/active_etf_holdings_history"

          os.makedirs("data", exist_ok=True)
          os.makedirs(HISTORY_DIR, exist_ok=True)

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)

          # =========================================
          # 共用工具
          # =========================================

          def to_number(value):

              if value is None:
                  return 0

              text = (
                  str(value)
                  .strip()
                  .replace(",", "")
                  .replace("%", "")
                  .replace(" ", "")
              )

              if text in ("", "-", "--"):
                  return 0

              try:
                  return float(text)
              except Exception:
                  return 0


          def to_integer(value):

              try:
                  return int(to_number(value))
              except Exception:
                  return 0


          # =========================================
          # 讀取舊資料
          # =========================================

          if os.path.exists(OUTPUT_FILE):

              try:

                  with open(
                      OUTPUT_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      output = json.load(f)

              except Exception:

                  output = {}

          else:

              output = {}


          if not isinstance(output, dict):
              output = {}

          if not isinstance(
              output.get("etfs"),
              dict
          ):
              output["etfs"] = {}


          # =========================================
          # 國泰 00400A
          # =========================================

          def fetch_cathay():

              ETF_CODE = "00400A"
              ETF_NAME = "主動國泰動能高息"
              FUND_CODE = "EA"

              API = (
                  "https://cwapi.cathaysite.com.tw"
                  "/api/ETF/GetETFDetailStockList"
              )

              headers = {

                  "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "Chrome/120 Safari/537.36",

                  "Accept":
                      "application/json, text/plain, */*",

                  "Origin":
                      "https://www.cathaysite.com.tw",

                  "Referer":
                      "https://www.cathaysite.com.tw/"
              }


              for days_back in range(0, 10):

                  target = (
                      now -
                      timedelta(days=days_back)
                  ).strftime("%Y-%m-%d")

                  params = urllib.parse.urlencode({
                      "FundCode": FUND_CODE,
                      "SearchDate": target
                  })

                  url = API + "?" + params

                  print()
                  print(
                      "Cathay:",
                      ETF_CODE,
                      target
                  )

                  try:

                      request = urllib.request.Request(
                          url,
                          headers=headers
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:

                          data = json.loads(
                              response
                              .read()
                              .decode("utf-8")
                          )

                  except Exception as error:

                      print(
                          "Cathay request error:",
                          error
                      )

                      continue


                  if not data.get("success"):
                      continue

                  rows = data.get("result") or []

                  if not rows:
                      continue


                  holdings = []

                  for row in rows:

                      code = str(
                          row.get("stockCode")
                          or ""
                      ).strip()

                      name = str(
                          row.get("stockName")
                          or ""
                      ).strip()

                      if not code:
                          continue

                      holdings.append({

                          "code": code,

                          "name": name,

                          "shares":
                              to_integer(
                                  row.get("volumn")
                              ),

                          "weight":
                              to_number(
                                  row.get("weights")
                              )
                      })


                  if holdings:

                      holdings.sort(
                          key=lambda item:
                              item["weight"],
                          reverse=True
                      )

                      return {

                          "code": ETF_CODE,

                          "name": ETF_NAME,

                          "issuer": "國泰投信",

                          "holdings_date":
                              target,

                          "source":
                              "Cathay Securities Investment Trust",

                          "status":
                              "success",

                          "holding_count":
                              len(holdings),

                          "holdings":
                              holdings
                      }


              raise RuntimeError(
                  "00400A 最近 10 天找不到持股"
              )


          # =========================================
          # 野村
          # =========================================

          NOMURA_ETFS = {

              "00980A":
                  "00980A",

              "00985A":
                  "00985A",

              "00999A":
                  "00999A"
          }


          NOMURA_NAMES = {

              "00980A":
                  "野村臺灣智慧優選主動式ETF",

              "00985A":
                  "主動野村台灣50",

              "00999A":
                  "主動野村臺灣策略高息"
          }


          NOMURA_API = (
              "https://www.nomurafunds.com.tw"
              "/API/ETFAPI/api/Fund/GetFundAssets"
          )


          NOMURA_HEADERS = {

              "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120.0.0.0 Safari/537.36",

              "Accept":
                  "application/json, text/plain, */*",

              "Accept-Language":
                  "zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7",

              "Content-Type":
                  "application/json",

              "Origin":
                  "https://www.nomurafunds.com.tw",

              "Referer":
                  "https://www.nomurafunds.com.tw/"
                  "ETFWEB/product-description"
          }


          def fetch_nomura(
              etf_code,
              fund_id,
              etf_name
          ):

              session = requests.Session()

              for days_back in range(0, 10):

                  target = (
                      now -
                      timedelta(days=days_back)
                  ).strftime("%Y-%m-%d")

                  print()
                  print(
                      "Nomura:",
                      etf_code,
                      target
                  )

                  payload = {

                      "FundID":
                          fund_id,

                      "SearchDate":
                          target
                  }


                  try:

                      response = session.post(

                          NOMURA_API,

                          json=payload,

                          headers=NOMURA_HEADERS,

                          timeout=30,

                          verify=False
                      )

                      print(
                          "HTTP:",
                          response.status_code
                      )

                      response.raise_for_status()

                      data = response.json()


                  except Exception as error:

                      print(
                          "Nomura request error:",
                          error
                      )

                      continue


                  # ---------------------------------
                  # API 正確結構：
                  #
                  # Entries
                  #   └ Data
                  #       └ Table
                  # ---------------------------------

                  entries = (
                      data.get("Entries")
                      or {}
                  )

                  data_block = (
                      entries.get("Data")
                      or {}
                  )

                  tables = (
                      data_block.get("Table")
                      or []
                  )


                  holdings = []


                  for table in tables:

                      if (
                          table.get("TableTitle")
                          != "股票"
                      ):
                          continue


                      rows = (
                          table.get("Rows")
                          or []
                      )


                      for row in rows:

                          if (
                              not isinstance(
                                  row,
                                  list
                              )
                              or len(row) < 4
                          ):
                              continue


                          code = str(
                              row[0]
                              or ""
                          ).strip()

                          name = str(
                              row[1]
                              or ""
                          ).strip()


                          if not code:
                              continue


                          holdings.append({

                              "code":
                                  code,

                              "name":
                                  name,

                              "shares":
                                  to_integer(
                                      row[2]
                                  ),

                              "weight":
                                  to_number(
                                      row[3]
                                  )
                          })


                  if holdings:

                      holdings.sort(
                          key=lambda item:
                              item["weight"],
                          reverse=True
                      )


                      return {

                          "code":
                              etf_code,

                          "name":
                              etf_name,

                          "issuer":
                              "野村投信",

                          "holdings_date":
                              target,

                          "source":
                              "Nomura Asset Management Taiwan",

                          "status":
                              "success",

                          "holding_count":
                              len(holdings),

                          "holdings":
                              holdings
                      }


                  print(
                      "No stock holdings:",
                      target
                  )


              raise RuntimeError(
                  etf_code +
                  " 最近 10 天找不到持股"
              )


          # =========================================
          # 開始抓取
          # =========================================

          successful_results = []


          print()
          print("==============================")
          print("ACTIVE ETF HOLDINGS UPDATE")
          print("==============================")


          # -----------------------------------------
          # 國泰
          # -----------------------------------------

          try:

              result = fetch_cathay()

              output["etfs"][
                  result["code"]
              ] = result

              successful_results.append(
                  result
              )

              print()
              print(
                  "SUCCESS:",
                  result["code"],
                  result["holding_count"],
                  "holdings"
              )


          except Exception as error:

              print()
              print(
                  "FAILED: 00400A",
                  error
              )


          # -----------------------------------------
          # 野村
          # -----------------------------------------

          for (
              code,
              fund_id
          ) in NOMURA_ETFS.items():

              try:

                  result = fetch_nomura(

                      code,

                      fund_id,

                      NOMURA_NAMES.get(
                          code,
                          code
                      )
                  )


                  output["etfs"][
                      code
                  ] = result

                  successful_results.append(
                      result
                  )


                  print()
                  print(
                      "SUCCESS:",
                      code,
                      result[
                          "holding_count"
                      ],
                      "holdings"
                  )


              except Exception as error:

                  print()
                  print(
                      "FAILED:",
                      code,
                      error
                  )


                  old = (
                      output["etfs"]
                      .get(
                          code,
                          {}
                      )
                  )


                  # 如果以前有成功資料，
                  # 不把舊資料洗掉
                  if old.get("holdings"):

                      old[
                          "last_fetch_status"
                      ] = "failed"

                      old[
                          "last_fetch_error"
                      ] = str(error)


                  else:

                      output["etfs"][
                          code
                      ] = {

                          "code":
                              code,

                          "name":
                              NOMURA_NAMES.get(
                                  code,
                                  code
                              ),

                          "issuer":
                              "野村投信",

                          "holdings_date":
                              None,

                          "source":
                              "Nomura Asset Management Taiwan",

                          "status":
                              "fetch_failed",

                          "holding_count":
                              0,

                          "holdings":
                              []
                      }


          # =========================================
          # Metadata
          # =========================================

          output["_meta"] = {

              "updated_at":
                  now.isoformat(),

              "database_version":
                  4,

              "description":
                  "Taiwan active ETF daily holdings database",

              "history_enabled":
                  True,

              "successful_fetches":
                  len(
                      successful_results
                  )
          }


          # =========================================
          # 寫入最新資料
          # =========================================

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================
          # 歷史快照
          # =========================================

          snapshot_date = max(

              [
                  item[
                      "holdings_date"
                  ]

                  for item
                  in successful_results

                  if item.get(
                      "holdings_date"
                  )
              ],

              default=
                  now.strftime(
                      "%Y-%m-%d"
                  )
          )


          history_file = os.path.join(

              HISTORY_DIR,

              snapshot_date +
              ".json"
          )


          with open(
              history_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================
          # 顯示測試結果
          # =========================================

          print()
          print("==============================")
          print("UPDATE FINISHED")
          print("==============================")


          TEST_CODES = [
              "00400A",
              "00980A",
              "00985A",
              "00999A"
          ]


          for code in TEST_CODES:

              item = (
                  output["etfs"]
                  .get(
                      code,
                      {}
                  )
              )

              print()
              print(
                  code,
                  item.get(
                      "name"
                  )
              )

              print(
                  "Status:",
                  item.get(
                      "status"
                  )
              )

              print(
                  "Date:",
                  item.get(
                      "holdings_date"
                  )
              )

              print(
                  "Holdings:",
                  item.get(
                      "holding_count",
                      0
                  )
              )


              for holding in (
                  item.get(
                      "holdings",
                      []
                  )[:5]
              ):

                  print(

                      " ",

                      holding.get(
                          "code"
                      ),

                      holding.get(
                          "name"
                      ),

                      "shares:",

                      holding.get(
                          "shares"
                      ),

                      "weight:",

                      holding.get(
                          "weight"
                      )
                  )


          print()
          print(
              "Saved:",
              OUTPUT_FILE
          )

          print(
              "Snapshot:",
              history_file
          )

          PY

      - name: Commit active ETF holdings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/active_etf_holdings.json
          git add data/active_etf_holdings_history/

          if git diff --cached --quiet; then
            echo "No ETF holding changes"
          else
            git commit -m "Fix Nomura active ETF holdings"
            git push
          fi
