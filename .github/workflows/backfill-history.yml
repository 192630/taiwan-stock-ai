name: Backfill Stock History

on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天 00:20、04:20，自動分批回填；每次仍維持 100 檔
    - cron: "20 16,20 * * *"

concurrency:
  group: backfill-stock-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backfill historical stock data
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone, timedelta

          STOCK_FILE = "data/stocks.json"
          HISTORY_FILE = "data/market_history.json"
          PROGRESS_FILE = "data/backfill_progress.json"

          # ==========================================
          # 設定
          # ==========================================

          # 每次 Run 最多處理 100 檔
          RUN_SIZE = 100

          # 每檔回補最近 6 個月份
          MONTHS = 6

          # 每次 TWSE 請求之間休息
          REQUEST_DELAY = 1.2


          def clean_number(value):

              if value is None:
                  return None

              text = str(value).strip()
              text = text.replace(",", "")

              if text in ("", "--", "---", "X"):
                  return None

              try:
                  return float(text)

              except (ValueError, TypeError):
                  return None


          def clean_integer(value):

              value = clean_number(value)

              if value is None:
                  return None

              return int(value)


          def roc_to_iso(value):

              text = str(value).strip()

              try:

                  parts = text.split("/")

                  if len(parts) != 3:
                      return text

                  year = int(parts[0]) + 1911
                  month = int(parts[1])
                  day = int(parts[2])

                  return (
                      f"{year:04d}-"
                      f"{month:02d}-"
                      f"{day:02d}"
                  )

              except Exception:
                  return text


          def month_list(count):

              tz = timezone(
                  timedelta(hours=8)
              )

              now = datetime.now(tz)

              year = now.year
              month = now.month

              result = []

              for _ in range(count):

                  result.append(
                      f"{year:04d}{month:02d}01"
                  )

                  month -= 1

                  if month == 0:
                      month = 12
                      year -= 1

              return result


          def download_month(code, date):

              params = urllib.parse.urlencode({
                  "response": "json",
                  "date": date,
                  "stockNo": code
              })

              url = (
                  "https://www.twse.com.tw/rwd/zh/"
                  "afterTrading/STOCK_DAY?"
                  + params
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:

                  return json.loads(
                      response
                      .read()
                      .decode("utf-8")
                  )


          # ==========================================
          # 建立 data 資料夾
          # ==========================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          # ==========================================
          # 讀取 stocks.json
          # ==========================================

          if not os.path.exists(STOCK_FILE):

              raise FileNotFoundError(
                  "找不到 data/stocks.json"
              )


          with open(
              STOCK_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              stock_json = json.load(f)


          if isinstance(stock_json, list):

              stock_rows = stock_json

          else:

              stock_rows = (
                  stock_json.get("stocks")
                  or stock_json.get("data")
                  or []
              )


          stock_codes = []


          for row in stock_rows:

              if not isinstance(row, dict):
                  continue

              code = str(
                  row.get("Code", "")
              ).strip().upper()

              if not code:
                  continue

              if code not in stock_codes:
                  stock_codes.append(code)


          stock_codes.sort()


          total_securities = len(
              stock_codes
          )


          print(
              "Total securities:",
              total_securities
          )


          if not stock_codes:

              raise RuntimeError(
                  "stocks.json 沒有找到任何股票代號"
              )


          # ==========================================
          # 讀取上一次進度
          # ==========================================

          start_index = 0


          if os.path.exists(PROGRESS_FILE):

              try:

                  with open(
                      PROGRESS_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      progress = json.load(f)


                  start_index = int(
                      progress.get(
                          "next_index",
                          0
                      )
                  )


              except Exception as error:

                  print(
                      "Progress file error:",
                      error
                  )

                  start_index = 0


          # 如果上一輪已經全部完成
          if start_index >= total_securities:

              start_index = 0


          end_index = min(
              start_index + RUN_SIZE,
              total_securities
          )


          run_codes = stock_codes[
              start_index:end_index
          ]


          print()
          print(
              "================================"
          )

          print(
              "This run:"
          )

          print(
              "Start index:",
              start_index
          )

          print(
              "End index:",
              end_index - 1
          )

          print(
              "Securities this run:",
              len(run_codes)
          )

          print(
              "================================"
          )


          # ==========================================
          # 讀取既有 market_history.json
          # ==========================================

          if os.path.exists(HISTORY_FILE):

              try:

                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      history = json.load(f)

              except Exception as error:

                  print(
                      "History file error:",
                      error
                  )

                  history = {}

          else:

              history = {}


          if not isinstance(history, dict):

              history = {}


          months = month_list(
              MONTHS
          )


          print(
              "Months:",
              months
          )


          # ==========================================
          # 統計
          # ==========================================

          successful_codes = 0
          empty_codes = 0
          failed_requests = 0
          processed_codes = 0


          # ==========================================
          # 開始處理這次的 100 檔
          # ==========================================

          for position, code in enumerate(
              run_codes,
              start=1
          ):

              print()
              print(
                  "================================"
              )

              print(
                  f"[{position}/{len(run_codes)}]",
                  "Backfilling:",
                  code
              )


              records_by_date = {}


              # --------------------------------------
              # 保留原本已有資料
              # --------------------------------------

              old_records = history.get(
                  code,
                  []
              )


              if isinstance(old_records, list):

                  for row in old_records:

                      if not isinstance(
                          row,
                          dict
                      ):
                          continue

                      date = row.get(
                          "date"
                      )

                      if date:

                          records_by_date[
                              date
                          ] = row


              downloaded_rows = 0


              # --------------------------------------
              # 抓最近 6 個月份
              # --------------------------------------

              for month in months:

                  print(
                      "Downloading",
                      code,
                      month
                  )


                  try:

                      data = download_month(
                          code,
                          month
                      )


                      rows = data.get(
                          "data",
                          []
                      )


                      if not isinstance(
                          rows,
                          list
                      ):

                          rows = []


                      print(
                          "Rows:",
                          len(rows)
                      )


                      downloaded_rows += len(
                          rows
                      )


                      # --------------------------------
                      # 解析 TWSE 每日資料
                      # --------------------------------

                      for row in rows:

                          if (
                              not isinstance(
                                  row,
                                  list
                              )
                              or len(row) < 7
                          ):

                              continue


                          date = roc_to_iso(
                              row[0]
                          )


                          record = {

                              "date":
                                  date,

                              "volume":
                                  clean_integer(
                                      row[1]
                                  ),

                              "open":
                                  clean_number(
                                      row[3]
                                  ),

                              "high":
                                  clean_number(
                                      row[4]
                                  ),

                              "low":
                                  clean_number(
                                      row[5]
                                  ),

                              "close":
                                  clean_number(
                                      row[6]
                                  )
                          }


                          if (
                              record["close"]
                              is not None
                          ):

                              records_by_date[
                                  date
                              ] = record


                  except Exception as error:

                      failed_requests += 1

                      print(
                          "REQUEST ERROR:",
                          code,
                          month,
                          error
                      )


                  # 避免連續大量請求
                  time.sleep(
                      REQUEST_DELAY
                  )


              # --------------------------------------
              # 整理這檔證券資料
              # --------------------------------------

              records = list(
                  records_by_date.values()
              )


              records.sort(
                  key=lambda row:
                  row.get(
                      "date",
                      ""
                  )
              )


              # 最多保留 150 個交易日
              records = records[-150:]


              history[
                  code
              ] = records


              processed_codes += 1


              if downloaded_rows > 0:

                  successful_codes += 1

              else:

                  empty_codes += 1


              print(
                  code,
                  "total records:",
                  len(records)
              )


          # ==========================================
          # 更新時間
          # ==========================================

          tz = timezone(
              timedelta(hours=8)
          )

          now = datetime.now(
              tz
          )


          # ==========================================
          # 判斷是否完成整輪
          # ==========================================

          cycle_complete = (
              end_index >= total_securities
          )


          next_index = (
              0
              if cycle_complete
              else end_index
          )


          # ==========================================
          # 更新 market_history meta
          # ==========================================

          history["_meta"] = {

              "updated_at":
                  now.isoformat(),

              "source":
                  "Taiwan Stock Exchange (TWSE)",

              "description":
                  "Historical daily OHLCV",

              "backfill_months":
                  MONTHS,

              "run_size":
                  RUN_SIZE,

              "last_start_index":
                  start_index,

              "last_end_index":
                  end_index,

              "total_securities":
                  total_securities,

              "cycle_complete":
                  cycle_complete
          }


          # ==========================================
          # 寫入 market_history.json
          # ==========================================

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ==========================================
          # 寫入 backfill_progress.json
          # ==========================================

          progress = {

              "updated_at":
                  now.isoformat(),

              "last_start_index":
                  start_index,

              "last_end_index":
                  end_index,

              "next_index":
                  next_index,

              "total_securities":
                  total_securities,

              "run_size":
                  RUN_SIZE,

              "processed_codes":
                  processed_codes,

              "successful_codes":
                  successful_codes,

              "empty_codes":
                  empty_codes,

              "failed_requests":
                  failed_requests,

              "cycle_complete":
                  cycle_complete
          }


          with open(
              PROGRESS_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  progress,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ==========================================
          # 最後摘要
          # ==========================================

          print()
          print(
              "================================"
          )

          print(
              "RUN COMPLETED"
          )

          print(
              "================================"
          )

          print(
              "Processed:",
              processed_codes
          )

          print(
              "Successful:",
              successful_codes
          )

          print(
              "Empty:",
              empty_codes
          )

          print(
              "Failed requests:",
              failed_requests
          )

          print(
              "Current range:",
              start_index,
              "to",
              end_index - 1
          )

          print(
              "Next index:",
              next_index
          )

          print(
              "Cycle complete:",
              cycle_complete
          )

          PY


      - name: Commit historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_history.json
          git add data/backfill_progress.json

          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "Backfill next stock history batch"
            git push
          fi
