name: Update Stock News

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_stock_news.py"
      - ".github/workflows/update-stock-news.yml"
  schedule:
    # 每小時分批更新 80 檔，避免一次查詢 1,000 多檔而逾時。
    - cron: "25 * * * *"

permissions:
  contents: write

concurrency:
  group: update-stock-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch stock-specific news batch
        run: python scripts/update_stock_news.py

      - name: Commit stock news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_news data/stock_news_progress.json
          if git diff --cached --quiet; then
            echo "No stock news changes"
            exit 0
          fi
          git commit -m "Update stock-specific news batch"
          git pull --rebase origin main
          git push
