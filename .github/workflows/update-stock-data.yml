name: Update Taiwan Stock Data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC
    # 台灣時間週一～週五 16:30
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: |
          mkdir -p data

      # ============================================================
      # 下載上市股票每日成交資料
      # ============================================================
      - name: Download TWSE stock data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          url = "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              stocks = json.loads(
                  response.read().decode("utf-8")
              )

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)

          output = {
              "updated_at": now.isoformat(),
              "source": "Taiwan Stock Exchange (TWSE)",
              "count": len(stocks),
              "stocks": stocks
          }

          with open(
              "data/stocks.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Downloaded",
              len(stocks),
              "stock records"
          )
          PY

      # ============================================================
      # 下載三大法人個股買賣超資料
      # ============================================================
      - name: Download institutional investor data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          url = "https://www.twse.com.tw/rwd/zh/fund/T86?response=json&selectType=ALLBUT0999"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)

          fields = data.get("fields", [])
          rows = data.get("data", [])

          output = {
              "updated_at": now.isoformat(),
              "source": "Taiwan Stock Exchange (TWSE T86)",
              "title": data.get("title"),
              "fields": fields,
              "count": len(rows),
              "institutional": rows
          }

          with open(
              "data/institutional.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Downloaded",
              len(rows),
              "institutional records"
          )
          PY

      # ============================================================
      # 更新精簡版市場歷史資料
      # 每支股票每天只保存 OHLCV
      # ============================================================
      - name: Update market history
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta

          STOCK_FILE = "data/stocks.json"
          HISTORY_FILE = "data/market_history.json"

          def number(value):
              if value is None:
                  return None

              text = str(value).strip()
              text = text.replace(",", "")

              if text in ("", "--", "---", "X"):
                  return None

              try:
                  return float(text)
              except ValueError:
                  return None

          def integer(value):
              n = number(value)

              if n is None:
                  return None

              return int(n)

          def convert_twse_date(value):
              text = str(value).strip()

              # STOCK_DAY_ALL 常見格式：
              # 1150915 = 民國115年09月15日
              if len(text) == 7 and text.isdigit():
                  roc_year = int(text[:3])
                  month = int(text[3:5])
                  day = int(text[5:7])

                  year = roc_year + 1911

                  return (
                      f"{year:04d}-"
                      f"{month:02d}-"
                      f"{day:02d}"
                  )

              # 如果未來 API 改成 YYYYMMDD
              if len(text) == 8 and text.isdigit():
                  return (
                      text[:4]
                      + "-"
                      + text[4:6]
                      + "-"
                      + text[6:8]
                  )

              return text

          with open(
              STOCK_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              latest = json.load(f)

          stocks = latest.get("stocks", [])

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      history = json.load(f)
              except Exception:
                  history = {}
          else:
              history = {}

          if not isinstance(history, dict):
              history = {}

          added = 0
          updated = 0
          skipped = 0

          for stock in stocks:
              code = str(
                  stock.get("Code", "")
              ).strip()

              raw_date = stock.get("Date", "")

              if not code or not raw_date:
                  skipped += 1
                  continue

              trade_date = convert_twse_date(
                  raw_date
              )

              record = {
                  "date": trade_date,
                  "open": number(
                      stock.get("OpeningPrice")
                  ),
                  "high": number(
                      stock.get("HighestPrice")
                  ),
                  "low": number(
                      stock.get("LowestPrice")
                  ),
                  "close": number(
                      stock.get("ClosingPrice")
                  ),
                  "volume": integer(
                      stock.get("TradeVolume")
                  )
              }

              if code not in history:
                  history[code] = []

              records = history[code]

              existing_index = None

              for index, old_record in enumerate(records):
                  if (
                      old_record.get("date")
                      == trade_date
                  ):
                      existing_index = index
                      break

              if existing_index is None:
                  records.append(record)
                  added += 1
              else:
                  if records[existing_index] != record:
                      records[existing_index] = record
                      updated += 1

              records.sort(
                  key=lambda item: item.get(
                      "date",
                      ""
                  )
              )

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)

          output = {
              "_meta": {
                  "updated_at": now.isoformat(),
                  "source": "Taiwan Stock Exchange (TWSE)",
                  "description": "Daily OHLCV history by security code"
              }
          }

          for code in sorted(history.keys()):
              if code == "_meta":
                  continue

              output[code] = history[code]

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Market history updated")
          print("Added:", added)
          print("Updated:", updated)
          print("Skipped:", skipped)
          print(
              "Securities:",
              len(output) - 1
          )
          PY

      # ============================================================
      # 提交更新
      # ============================================================
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stocks.json
          git add data/institutional.json
          git add data/market_history.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Taiwan stock data"
            git push
          fi
