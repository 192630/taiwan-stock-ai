name: Update Taiwan Stock Data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-stock-data.yml"
  schedule:
    # GitHub Actions 使用 UTC
    # 台灣時間週一～週五 16:30
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: |
          mkdir -p data

      # ============================================================
      # 下載上市股票每日成交資料
      # ============================================================
      - name: Download TWSE stock data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          url = "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              stocks = json.loads(
                  response.read().decode("utf-8")
              )

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)

          output = {
              "updated_at": now.isoformat(),
              "source": "Taiwan Stock Exchange (TWSE)",
              "count": len(stocks),
              "stocks": stocks
          }

          with open(
              "data/stocks.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Downloaded",
              len(stocks),
              "stock records"
          )
          PY

      # ============================================================
      # 下載三大法人個股買賣超資料
      # ============================================================
      - name: Download institutional investor data
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          url = "https://www.twse.com.tw/rwd/zh/fund/T86?response=json&selectType=ALLBUT0999"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              data = json.loads(
                  response.read().decode("utf-8")
              )

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)

          fields = data.get("fields", [])
          rows = data.get("data", [])

          output = {
              "updated_at": now.isoformat(),
              "source": "Taiwan Stock Exchange (TWSE T86)",
              "title": data.get("title"),
              "fields": fields,
              "count": len(rows),
              "institutional": rows
          }

          raw_trade_date = str(data.get("date") or "").strip()

          if not raw_trade_date:
              try:
                  with open("data/stocks.json", "r", encoding="utf-8") as f:
                      stock_payload = json.load(f)
                  raw_trade_date = str(
                      (stock_payload.get("stocks") or [{}])[0].get("Date") or ""
                  ).strip()
              except Exception:
                  raw_trade_date = ""

          digits = "".join(char for char in raw_trade_date if char.isdigit())
          if len(digits) == 7:
              trade_date = f"{int(digits[:3]) + 1911:04d}-{digits[3:5]}-{digits[5:7]}"
          elif len(digits) == 8:
              trade_date = f"{digits[:4]}-{digits[4:6]}-{digits[6:8]}"
          else:
              trade_date = now.strftime("%Y-%m-%d")

          output["trade_date"] = trade_date

          with open(
              "data/institutional.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          os.makedirs("data/institutional_history", exist_ok=True)
          with open(
              f"data/institutional_history/{trade_date}.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(
              "Downloaded",
              len(rows),
              "institutional records for",
              trade_date
          )
          PY

      # ============================================================
      # 下載上市／上櫃公司月營收與最新季報獲利
      # 月營收與季報期間不同，前端必須分開標示
      # ============================================================
      - name: Download company revenue and profit data
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          def fetch_first(urls):
              errors = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=90) as response:
                          payload = json.loads(response.read().decode("utf-8-sig"))
                      if isinstance(payload, list):
                          print("Fetched", len(payload), "rows from", url)
                          return payload, url
                  except Exception as error:
                      errors.append(f"{url}: {error}")
              print("All endpoints failed:", " | ".join(errors))
              return [], ""

          def pick(row, *names):
              for name in names:
                  if name in row and str(row.get(name, "")).strip() not in ("", "--", "---"):
                      return row.get(name)
              return None

          def number(value):
              if value is None:
                  return None
              text = str(value).strip().replace(",", "").replace("%", "")
              if text in ("", "--", "---", "N/A"):
                  return None
              try:
                  return float(text)
              except ValueError:
                  return None

          revenue_sources = [
              (
                  "上市",
                  [
                      "https://openapi.twse.com.tw/v1/opendata/t187ap05_L",
                      "https://mopsfin.twse.com.tw/opendata/t187ap05_L.json"
                  ]
              ),
              (
                  "上櫃",
                  [
                      "https://openapi.twse.com.tw/v1/opendata/t187ap05_P",
                      "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O"
                  ]
              )
          ]

          profit_sources = [
              (
                  "上市",
                  [
                      "https://openapi.twse.com.tw/v1/opendata/t187ap06_L",
                      "https://openapi.twse.com.tw/v1/opendata/t187ap07_L",
                      "https://mopsfin.twse.com.tw/opendata/t187ap06_L.json",
                      "https://mopsfin.twse.com.tw/opendata/t187ap07_L.json"
                  ]
              ),
              (
                  "上櫃",
                  [
                      "https://openapi.twse.com.tw/v1/opendata/t187ap06_P",
                      "https://openapi.twse.com.tw/v1/opendata/t187ap07_P",
                      "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap06_O",
                      "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap07_O"
                  ]
              )
          ]

          companies = {}
          used_sources = []

          for market, urls in revenue_sources:
              rows, used_url = fetch_first(urls)
              if used_url:
                  used_sources.append(used_url)
              for row in rows:
                  code = str(pick(row, "公司代號", "公司代碼", "股票代號") or "").strip()
                  if not code:
                      continue
                  item = companies.setdefault(code, {"code": code})
                  item.update({
                      "name": str(pick(row, "公司名稱", "公司簡稱") or item.get("name") or "").strip(),
                      "market": market,
                      "industry": str(pick(row, "產業別", "產業類別") or "").strip(),
                      "revenue_period": str(pick(row, "資料年月", "營業收入-資料年月", "年月") or "").strip(),
                      "monthly_revenue": number(pick(row, "營業收入-當月營收", "當月營收", "本月營業收入")),
                      "previous_month_revenue": number(pick(row, "營業收入-上月營收", "上月營收")),
                      "last_year_month_revenue": number(pick(row, "營業收入-去年當月營收", "去年當月營收")),
                      "monthly_mom_percent": number(pick(row, "營業收入-上月比較增減(%)", "上月比較增減(%)", "月增率")),
                      "monthly_yoy_percent": number(pick(row, "營業收入-去年同月增減(%)", "去年同月增減(%)", "年增率")),
                      "cumulative_revenue": number(pick(row, "累計營業收入-當月累計營收", "當月累計營收", "累計營業收入")),
                      "last_year_cumulative_revenue": number(pick(row, "累計營業收入-去年累計營收", "去年累計營收")),
                      "cumulative_yoy_percent": number(pick(row, "累計營業收入-前期比較增減(%)", "前期比較增減(%)", "累計年增率")),
                      "revenue_note": str(pick(row, "備註") or "").strip()
                  })

          for market, urls in profit_sources:
              rows, used_url = fetch_first(urls)
              if used_url:
                  used_sources.append(used_url)
              for row in rows:
                  code = str(pick(row, "公司代號", "公司代碼", "股票代號") or "").strip()
                  if not code:
                      continue
                  item = companies.setdefault(code, {"code": code})
                  year = str(pick(row, "年度", "年") or "").strip()
                  quarter = str(pick(row, "季別", "季") or "").strip()
                  item.update({
                      "name": str(pick(row, "公司名稱", "公司簡稱") or item.get("name") or "").strip(),
                      "market": item.get("market") or market,
                      "profit_period": (year + "年第" + quarter + "季") if year and quarter else (year or quarter),
                      "quarter_revenue": number(pick(row, "營業收入", "收益")),
                      "gross_profit": number(pick(row, "營業毛利（毛損）淨額", "營業毛利（毛損）")),
                      "operating_profit": number(pick(row, "營業利益（損失）")),
                      "net_profit": number(pick(row, "本期淨利（淨損）", "本期稅後淨利（淨損）")),
                      "parent_net_profit": number(pick(row, "歸屬於母公司業主之淨利（損）")),
                      "eps": number(pick(row, "基本每股盈餘（元）", "基本每股盈餘"))
                  })

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)
          periods = [
              item.get("revenue_period")
              for item in companies.values()
              if item.get("revenue_period")
          ]
          latest_revenue_period = max(periods) if periods else ""

          output = {
              "schema_version": 1,
              "updated_at": now.isoformat(),
              "source": "臺灣證券交易所／公開資訊觀測站 Open Data",
              "source_urls": used_sources,
              "latest_revenue_period": latest_revenue_period,
              "company_count": len(companies),
              "unit": "新臺幣仟元；EPS為元",
              "companies": dict(sorted(companies.items()))
          }

          with open("data/company_financials.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          if latest_revenue_period:
              os.makedirs("data/company_financials_history", exist_ok=True)
              safe_period = latest_revenue_period.replace("/", "-")
              with open(
                  f"data/company_financials_history/{safe_period}.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(output, f, ensure_ascii=False, indent=2)

          print("Company financial records:", len(companies))
          print("Latest revenue period:", latest_revenue_period or "unknown")
          PY

      # ============================================================
      # 更新精簡版市場歷史資料
      # 每支股票每天只保存 OHLCV
      # ============================================================
      - name: Update market history
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta

          STOCK_FILE = "data/stocks.json"
          HISTORY_FILE = "data/market_history.json"

          def number(value):
              if value is None:
                  return None

              text = str(value).strip()
              text = text.replace(",", "")

              if text in ("", "--", "---", "X"):
                  return None

              try:
                  return float(text)
              except ValueError:
                  return None

          def integer(value):
              n = number(value)

              if n is None:
                  return None

              return int(n)

          def convert_twse_date(value):
              text = str(value).strip()

              # STOCK_DAY_ALL 常見格式：
              # 1150915 = 民國115年09月15日
              if len(text) == 7 and text.isdigit():
                  roc_year = int(text[:3])
                  month = int(text[3:5])
                  day = int(text[5:7])

                  year = roc_year + 1911

                  return (
                      f"{year:04d}-"
                      f"{month:02d}-"
                      f"{day:02d}"
                  )

              # 如果未來 API 改成 YYYYMMDD
              if len(text) == 8 and text.isdigit():
                  return (
                      text[:4]
                      + "-"
                      + text[4:6]
                      + "-"
                      + text[6:8]
                  )

              return text

          with open(
              STOCK_FILE,
              "r",
              encoding="utf-8"
          ) as f:
              latest = json.load(f)

          stocks = latest.get("stocks", [])

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(
                      HISTORY_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      history = json.load(f)
              except Exception:
                  history = {}
          else:
              history = {}

          if not isinstance(history, dict):
              history = {}

          added = 0
          updated = 0
          skipped = 0

          for stock in stocks:
              code = str(
                  stock.get("Code", "")
              ).strip()

              raw_date = stock.get("Date", "")

              if not code or not raw_date:
                  skipped += 1
                  continue

              trade_date = convert_twse_date(
                  raw_date
              )

              record = {
                  "date": trade_date,
                  "open": number(
                      stock.get("OpeningPrice")
                  ),
                  "high": number(
                      stock.get("HighestPrice")
                  ),
                  "low": number(
                      stock.get("LowestPrice")
                  ),
                  "close": number(
                      stock.get("ClosingPrice")
                  ),
                  "volume": integer(
                      stock.get("TradeVolume")
                  )
              }

              if code not in history:
                  history[code] = []

              records = history[code]

              existing_index = None

              for index, old_record in enumerate(records):
                  if (
                      old_record.get("date")
                      == trade_date
                  ):
                      existing_index = index
                      break

              if existing_index is None:
                  records.append(record)
                  added += 1
              else:
                  if records[existing_index] != record:
                      records[existing_index] = record
                      updated += 1

              records.sort(
                  key=lambda item: item.get(
                      "date",
                      ""
                  )
              )

          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)

          output = {
              "_meta": {
                  "updated_at": now.isoformat(),
                  "source": "Taiwan Stock Exchange (TWSE)",
                  "description": "Daily OHLCV history by security code"
              }
          }

          for code in sorted(history.keys()):
              if code == "_meta":
                  continue

              output[code] = history[code]

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Market history updated")
          print("Added:", added)
          print("Updated:", updated)
          print("Skipped:", skipped)
          print(
              "Securities:",
              len(output) - 1
          )
          PY

      # ============================================================
      # 提交更新
      # ============================================================
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stocks.json
          git add data/institutional.json
          git add data/institutional_history
          git add data/company_financials.json
          git add data/company_financials_history
          git add data/market_history.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update Taiwan stock data"
            git push
          fi
