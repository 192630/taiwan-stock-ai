name: Update Taiwan Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Download TWSE stock data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          url = "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              stocks = json.loads(response.read().decode("utf-8"))

          tz = timezone(timedelta(hours=8))

          output = {
              "updated_at": datetime.now(tz).isoformat(timespec="seconds"),
              "source": "Taiwan Stock Exchange (TWSE)",
              "count": len(stocks),
              "stocks": stocks
          }

          with open("data/stocks.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Downloaded", len(stocks), "stocks")
          PY

      - name: Download institutional investor data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          url = "https://www.twse.com.tw/rwd/en/fund/T86?response=json&selectType=ALL"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          tz = timezone(timedelta(hours=8))

          output = {
              "updated_at": datetime.now(tz).isoformat(timespec="seconds"),
              "source": "Taiwan Stock Exchange (TWSE T86)",
              "title": data.get("title"),
              "fields": data.get("fields", []),
              "count": len(data.get("data", [])),
              "institutional": data.get("data", [])
          }

          with open("data/institutional.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Downloaded", output["count"], "institutional records")
          PY

      - name: Commit updated data
        run: |
          git config user.name "taiwan-stock-ai-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/institutional.json
          git diff --cached --quiet || git commit -m "Auto update Taiwan stock data"
          git push
