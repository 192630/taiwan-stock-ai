name: Update Market News

on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天 07:15、12:15、18:15、22:15
    - cron: "15 23,4,10,14 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch recent Taiwan market news
        run: python scripts/update_news.py

      - name: Commit news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes"
            exit 0
          fi
          git commit -m "Update market news"
          git push
