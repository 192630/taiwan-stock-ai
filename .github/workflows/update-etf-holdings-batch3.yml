          # =========================================

          old_meta = (
              output.get("_meta")
              or {}
          )


          output["_meta"] = {

              **old_meta,

              "updated_at":
                  now.isoformat(),

              "database_version":
                  max(
                      int(
                          old_meta.get(
                              "database_version",
                              6
                          )
                      ),
                      7
                  ),

              "description":
